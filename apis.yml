name: RealWear
description: >-
  RealWear builds rugged, hands-free head-mounted and assisted-reality wearable
  computers (the Navigator series and HMT-1) for frontline and industrial workers
  in energy, manufacturing, field service, and utilities. Its Android-based devices
  are operated entirely by voice through the on-device WearHF service, which turns
  any Android app's touch controls into voice commands and can be tuned with WearML
  voice directives placed in UI metadata — so there is no separate SDK to install.
  RealWear now also ships Ari, a voice-first AI assistant (Ari OS and the Ari Cloud
  dashboard) with Microsoft connectors (Teams, Outlook email and calendar, contacts,
  Copilot), skills, and cross-session memory. Developers extend the platform with
  native Android, Unity, React Native, Cordova, Xamarin, and HTML apps plus custom
  Ari skills. This profile was surfaced as a Foundry Group portfolio company and
  enriched from RealWear's public developer surface.
